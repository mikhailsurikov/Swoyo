[project]
name = "phone-book"
version = "0.11.0"
description = "phone book"
authors = [
    {name = "mikhail surikov"}
]
requires-python = ">=3.10"
dependencies = [
    "tabulate (>=0.10.0,<0.11.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
